name: Build iOS IPA

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install JS dependencies
        run: npm install --loglevel error --legacy-peer-deps

      - name: Bundle JS
        run: |
          npx react-native bundle \
            --platform ios \
            --dev false \
            --entry-file index.js \
            --bundle-output ios/IOSMirror/main.jsbundle \
            --assets-dest ios/IOSMirror

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -workspace ios/IOSMirror.xcworkspace \
            -scheme IOSMirror \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package as IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/IOSMirror.app
          # react-native-xcode.sh may skip bundling in CI; guarantee the file is present.
          if [ ! -f "$APP/main.jsbundle" ]; then
            cp ios/IOSMirror/main.jsbundle "$APP/main.jsbundle"
          fi
          mkdir Payload
          cp -r "$APP" Payload/
          zip -r app.ipa Payload/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: IOSMirror-${{ github.run_number }}
          path: app.ipa
          retention-days: 30
