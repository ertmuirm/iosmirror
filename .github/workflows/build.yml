name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -workspace ios/IOSMirror.xcworkspace \
            -scheme IOSMirror \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package as IPA
        run: |
          mkdir Payload
          cp -r build/Build/Products/Release-iphoneos/IOSMirror.app Payload/
          zip -r app.ipa Payload/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: IOSMirror-${{ github.run_number }}
          path: app.ipa
          retention-days: 30
