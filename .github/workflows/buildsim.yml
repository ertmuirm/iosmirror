name: Build iOS IPA sim

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install

      - name: Build (unsigned)
        run: |
          xcodebuild archive -sdk iphonesimulator -scheme IOSMirror -configuration Release -archivePath ./build/IOSMirror.xarchive CODE_SIGNING_ALLOWED=NO \

      - name: Package as IPA
        run: |
          mkdir -p Payload
          cp -r ./build/IOSMirror.xarchive/Products/Applications/IOSMirror.app Payload/
          chmod +x Payload/IOSMirror.app/IOSMirror
          zip -r IOSMirror.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: IOSMirror
          path: IOSMirror.ipa
          retention-days: 30
